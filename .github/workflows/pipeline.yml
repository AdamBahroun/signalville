name: Pipeline DevOps

# Se lance sur chaque pull request vers main
on:
  pull_request:
    branches: [main]

# Droits minimaux : le workflow lit le dépôt, rien d'autre
permissions:
  contents: read

jobs:
  tests:
    name: Tests API
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        # Attend que MongoDB réponde avant de lancer les tests
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI_TEST: mongodb://127.0.0.1:27017/tuniins_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      # Installation exacte des dépendances du fichier package-lock.json
      - run: npm ci
      # Résultats lisibles dans le journal (spec) ET rapport JUnit dans un fichier
      - name: Lancer les tests
        run: npm test -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-report.xml
      # always() : le rapport est publié même si les tests échouent, c'est là qu'on en a besoin
      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: api/test-report.xml
          if-no-files-found: error

  build:
    name: Construction de l'image
    # Ne démarre que si le job "tests" a réussi
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image de l'API
        run: docker build -t signalville-api:ci ./api
      # Contrôle de bout en bout : la pile démarre et /health répond 200 (script de l'étape 2)
      - name: Démarrer la pile et contrôler la santé
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" > .env
          docker compose up -d --build
          bash scripts/verifier.sh http://localhost:3000
      - name: Afficher les journaux si le contrôle échoue
        if: failure()
        run: docker compose logs
      - name: Arrêter la pile
        if: always()
        run: docker compose down -v
